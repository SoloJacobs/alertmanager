# ---------------------------------------------------------------------------
# Route tree
#
# Evaluation order:
#   1. Watchdog / InfoInhibitor → null (always)
#   2. env=~"prod.*" + severity=critical → production-critical (continue=true
#      so it ALSO falls through to the team route below)
#   3. namespace=~"kube-.*" → kube-system-receiver
#   4. job=~".*-exporter"   → exporter-receiver
#   5. team-N routes (exact match) → cluster sub-routes → priority leaf routes
#   6. Root default catch-all
#
# group_by includes all routing dimensions so that alerts with different
# team/cluster/priority/alertname each form their own aggregation group.
# This maximises the group count (matching the benchmark scenario of
# 5000–10000 groups) and stresses the dispatcher appropriately.
# ---------------------------------------------------------------------------
route:
  receiver: "default"
  group_by: [alertname, team, cluster, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # --- Watchdog: always active, always silent ---
    - matchers:
        - alertname = "Watchdog"
      receiver: "null"
      group_wait: 0s
      repeat_interval: 1h

    # --- Info-level inhibitor: silent by design ---
    - matchers:
        - alertname = "InfoInhibitor"
      receiver: "null"
      group_wait: 0s
      repeat_interval: 1h

    # --- Production critical: regex on env label ---
    # Matches "production-us-east-1", "production-eu-west-1", etc.
    # continue: true so the alert also matches a team route below.
    - matchers:
        - env =~ "prod.*"
        - severity = "critical"
      receiver: "production-critical"
      group_by: [alertname, cluster, namespace]
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
      continue: true

    # --- Kubernetes system namespace: regex on namespace ---
    # Matches "kube-system", "kube-public"
    - matchers:
        - namespace =~ "kube-.*"
      receiver: "kube-system-receiver"
      group_by: [alertname, cluster]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
      continue: true

    # --- Exporter jobs: regex on job label ---
    # Matches "node-exporter", "prometheus-exporter"
    - matchers:
        - job =~ ".*-exporter"
      receiver: "exporter-receiver"
      group_by: [alertname, cluster, node]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
      continue: true

    # --- Team routes: exact match on "team" label ---
    # Each team route has 4 cluster sub-routes, each with 5 priority leaves.
    # This creates the 500-leaf tree that BenchmarkGroups uses.

    - matchers: [team = "team-0"]
      receiver: "team-0-default"
      group_by: [alertname, cluster, priority]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: [cluster = "cluster-0"]
          receiver: "team-0-cluster-0-p0"  # fallback if no priority match
          routes:
            - matchers: [priority = "p0"]
              receiver: "team-0-cluster-0-p0"
            - matchers: [priority = "p1"]
              receiver: "team-0-cluster-0-p1"
            - matchers: [priority = "p2"]
              receiver: "team-0-cluster-0-p2"
            - matchers: [priority = "p3"]
              receiver: "team-0-cluster-0-p3"
            - matchers: [priority = "p4"]
              receiver: "team-0-cluster-0-p4"
        - matchers: [cluster = "cluster-1"]
          receiver: "team-0-cluster-1-p0"
          routes:
            - matchers: [priority = "p0"]
              receiver: "team-0-cluster-1-p0"
            - matchers: [priority = "p1"]
              receiver: "team-0-cluster-1-p1"
            - matchers: [priority = "p2"]
              receiver: "team-0-cluster-1-p2"
            - matchers: [priority = "p3"]
              receiver: "team-0-cluster-1-p3"
            - matchers: [priority = "p4"]
              receiver: "team-0-cluster-1-p4"
        - matchers: [cluster = "cluster-2"]
          receiver: "team-0-cluster-2-p0"
          routes:
            - matchers: [priority = "p0"]
              receiver: "team-0-cluster-2-p0"
            - matchers: [priority = "p1"]
              receiver: "team-0-cluster-2-p1"
            - matchers: [priority = "p2"]
              receiver: "team-0-cluster-2-p2"
            - matchers: [priority = "p3"]
              receiver: "team-0-cluster-2-p3"
            - matchers: [priority = "p4"]
              receiver: "team-0-cluster-2-p4"
        - matchers: [cluster = "cluster-3"]
          receiver: "team-0-cluster-3-p0"
          routes:
            - matchers: [priority = "p0"]
              receiver: "team-0-cluster-3-p0"
            - matchers: [priority = "p1"]
              receiver: "team-0-cluster-3-p1"
            - matchers: [priority = "p2"]
              receiver: "team-0-cluster-3-p2"
            - matchers: [priority = "p3"]
              receiver: "team-0-cluster-3-p3"
            - matchers: [priority = "p4"]
              receiver: "team-0-cluster-3-p4"

    # teams 1-24: same structure, falling back to team-N-default for
    # any cluster/priority combination not explicitly listed.
    # Add their cluster/priority sub-routes identically to team-0 above.
    - matchers: [team = "team-1"]
