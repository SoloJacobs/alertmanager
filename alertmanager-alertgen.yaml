# alertmanager.yml
#
# Designed to work with cmd/alertgen (see inhibit_rules below).
#
# Route tree structure mirrors the generator's label pools exactly:
#   - 25 team routes  (team-0 .. team-24)
#   - 4 cluster sub-routes per team (cluster-0 .. cluster-3)
#   - 5 priority sub-routes per cluster (p0 .. p4)
#   → 500 leaf routes total
#
# Additional specialty routes exercise:
#   - Regex matching  (env=~"prod.*", namespace=~"kube-.*", job=~".*-exporter")
#   - Inhibition rules (critical → warning → info cascade)
#   - A catch-all "default" receiver for unmatched alerts
#
# All receivers use the null webhook (http://localhost:1/webhook) so the
# config is valid and loadable without a real downstream target.
# Replace with your actual receiver URLs as needed.

global:
  resolve_timeout: 5m

  # Default SMTP / PagerDuty / etc. settings would go here.
  # Left empty so the file validates without external credentials.

# ---------------------------------------------------------------------------
# Inhibition rules
#
# Written against a log from `cmd/alertgen`, whose alerts arrive in quads of
# four consecutive indices sharing (alertname, namespace, cluster, priority)
# and cycling severity critical -> warning -> info -> none. team, job, env and
# service all change inside a quad.
#
# That shape decides which `equal` sets can ever fire:
#
#   alertname / namespace / cluster / priority  usable, constant across a quad
#   team / job / service                        never fires: holding one of
#                                               these fixed forces the index
#                                               delta to a multiple of 8 (100
#                                               for team), which also fixes
#                                               severity, so source and target
#                                               can never differ in severity
#
# With -active 4m over a -scrape 30s, alerts co-fire iff they are within 7
# batches (~2224 indices). Every quad is 4 wide, so anything keyed inside a
# quad always overlaps in time.
#
# Rules marked DEAD below are kept deliberately: they are the sort of stale
# rule a real config accumulates, and they cost source-cache work while never
# muting anything.
#
# Watchdog is never a target, so it stays visible.
# ---------------------------------------------------------------------------
inhibit_rules:

  # --- Severity cascade (3) -------------------------------------------------
  # The classic. Live: all three labels are constant across a quad.
  - source_matchers: ['severity = "critical"']
    target_matchers: ['severity = "warning"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "warning"']
    target_matchers: ['severity = "info"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"']
    target_matchers: ['severity = "info"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]

  # --- Node down suppresses workload alerts in the same cluster (4) ---------
  # equal on cluster only, so a node-level critical mutes pod/daemonset/CPU
  # noise across every namespace of that cluster.
  - source_matchers: ['alertname = "KubeNodeNotReady"', 'severity = "critical"', 'cluster = "cluster-0"']
    target_matchers: ['severity =~ "warning|info|none"', 'alertname =~ "KubePodNotReady|KubeDaemonSetRolloutStuck|CPUThrottlingHigh|HighMemoryUsage"', 'cluster = "cluster-0"']
    equal: [cluster]
  - source_matchers: ['alertname = "KubeNodeNotReady"', 'severity = "critical"', 'cluster = "cluster-1"']
    target_matchers: ['severity =~ "warning|info|none"', 'alertname =~ "KubePodNotReady|KubeDaemonSetRolloutStuck|CPUThrottlingHigh|HighMemoryUsage"', 'cluster = "cluster-1"']
    equal: [cluster]
  - source_matchers: ['alertname = "KubeNodeNotReady"', 'severity = "critical"', 'cluster = "cluster-2"']
    target_matchers: ['severity =~ "warning|info|none"', 'alertname =~ "KubePodNotReady|KubeDaemonSetRolloutStuck|CPUThrottlingHigh|HighMemoryUsage"', 'cluster = "cluster-2"']
    equal: [cluster]
  - source_matchers: ['alertname = "KubeNodeNotReady"', 'severity = "critical"', 'cluster = "cluster-3"']
    target_matchers: ['severity =~ "warning|info|none"', 'alertname =~ "KubePodNotReady|KubeDaemonSetRolloutStuck|CPUThrottlingHigh|HighMemoryUsage"', 'cluster = "cluster-3"']
    equal: [cluster]

  # --- Cluster-wide API outage, no equal (4) --------------------------------
  # No equal at all: any active AggregatedAPIDown critical in the cluster mutes
  # every non-critical alert there. Takes the cheap path in Mutes (returns on
  # the first active source instead of scanning the whole source cache).
  - source_matchers: ['alertname = "AggregatedAPIDown"', 'severity = "critical"', 'cluster = "cluster-0"']
    target_matchers: ['severity =~ "warning|info"', 'cluster = "cluster-0"', 'alertname != "Watchdog"']
  - source_matchers: ['alertname = "AggregatedAPIDown"', 'severity = "critical"', 'cluster = "cluster-1"']
    target_matchers: ['severity =~ "warning|info"', 'cluster = "cluster-1"', 'alertname != "Watchdog"']
  - source_matchers: ['alertname = "AggregatedAPIDown"', 'severity = "critical"', 'cluster = "cluster-2"']
    target_matchers: ['severity =~ "warning|info"', 'cluster = "cluster-2"', 'alertname != "Watchdog"']
  - source_matchers: ['alertname = "AggregatedAPIDown"', 'severity = "critical"', 'cluster = "cluster-3"']
    target_matchers: ['severity =~ "warning|info"', 'cluster = "cluster-3"', 'alertname != "Watchdog"']

  # --- Per-alertname critical -> warning|info (11) --------------------------
  # Watchdog omitted so it is never muted.
  - source_matchers: ['severity = "critical"', 'alertname = "KubeNodeNotReady"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "KubeNodeNotReady"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "KubePodNotReady"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "KubePodNotReady"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "KubeDaemonSetRolloutStuck"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "KubeDaemonSetRolloutStuck"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "KubeJobFailed"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "KubeJobFailed"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "KubeJobCompletion"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "KubeJobCompletion"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "NodeClockNotSynchronising"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "NodeClockNotSynchronising"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "KubePersistentVolumeFillingUp"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "KubePersistentVolumeFillingUp"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "AggregatedAPIDown"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "AggregatedAPIDown"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "HighMemoryUsage"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "HighMemoryUsage"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "CPUThrottlingHigh"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "CPUThrottlingHigh"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "critical"', 'alertname = "TargetDown"']
    target_matchers: ['severity =~ "warning|info"', 'alertname = "TargetDown"']
    equal: [namespace, cluster]

  # --- Per-namespace critical -> warning (10) -------------------------------
  - source_matchers: ['severity = "critical"', 'namespace = "kube-system"']
    target_matchers: ['severity = "warning"', 'namespace = "kube-system"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "kube-public"']
    target_matchers: ['severity = "warning"', 'namespace = "kube-public"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "payments"']
    target_matchers: ['severity = "warning"', 'namespace = "payments"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "checkout"']
    target_matchers: ['severity = "warning"', 'namespace = "checkout"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "orders"']
    target_matchers: ['severity = "warning"', 'namespace = "orders"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "monitoring"']
    target_matchers: ['severity = "warning"', 'namespace = "monitoring"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "ingress"']
    target_matchers: ['severity = "warning"', 'namespace = "ingress"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "search"']
    target_matchers: ['severity = "warning"', 'namespace = "search"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "batch-jobs"']
    target_matchers: ['severity = "warning"', 'namespace = "batch-jobs"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "critical"', 'namespace = "metalk8s-monitoring"']
    target_matchers: ['severity = "warning"', 'namespace = "metalk8s-monitoring"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]

  # --- Per-namespace warning -> info (10) -----------------------------------
  - source_matchers: ['severity = "warning"', 'namespace = "kube-system"']
    target_matchers: ['severity = "info"', 'namespace = "kube-system"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "kube-public"']
    target_matchers: ['severity = "info"', 'namespace = "kube-public"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "payments"']
    target_matchers: ['severity = "info"', 'namespace = "payments"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "checkout"']
    target_matchers: ['severity = "info"', 'namespace = "checkout"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "orders"']
    target_matchers: ['severity = "info"', 'namespace = "orders"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "monitoring"']
    target_matchers: ['severity = "info"', 'namespace = "monitoring"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "ingress"']
    target_matchers: ['severity = "info"', 'namespace = "ingress"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "search"']
    target_matchers: ['severity = "info"', 'namespace = "search"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "batch-jobs"']
    target_matchers: ['severity = "info"', 'namespace = "batch-jobs"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['severity = "warning"', 'namespace = "metalk8s-monitoring"']
    target_matchers: ['severity = "info"', 'namespace = "metalk8s-monitoring"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]

  # --- Per-alertname warning -> none (11) -----------------------------------
  - source_matchers: ['severity = "warning"', 'alertname = "KubeNodeNotReady"']
    target_matchers: ['severity = "none"', 'alertname = "KubeNodeNotReady"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "KubePodNotReady"']
    target_matchers: ['severity = "none"', 'alertname = "KubePodNotReady"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "KubeDaemonSetRolloutStuck"']
    target_matchers: ['severity = "none"', 'alertname = "KubeDaemonSetRolloutStuck"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "KubeJobFailed"']
    target_matchers: ['severity = "none"', 'alertname = "KubeJobFailed"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "KubeJobCompletion"']
    target_matchers: ['severity = "none"', 'alertname = "KubeJobCompletion"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "NodeClockNotSynchronising"']
    target_matchers: ['severity = "none"', 'alertname = "NodeClockNotSynchronising"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "KubePersistentVolumeFillingUp"']
    target_matchers: ['severity = "none"', 'alertname = "KubePersistentVolumeFillingUp"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "AggregatedAPIDown"']
    target_matchers: ['severity = "none"', 'alertname = "AggregatedAPIDown"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "HighMemoryUsage"']
    target_matchers: ['severity = "none"', 'alertname = "HighMemoryUsage"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "CPUThrottlingHigh"']
    target_matchers: ['severity = "none"', 'alertname = "CPUThrottlingHigh"']
    equal: [namespace, cluster]
  - source_matchers: ['severity = "warning"', 'alertname = "TargetDown"']
    target_matchers: ['severity = "none"', 'alertname = "TargetDown"']
    equal: [namespace, cluster]

  # --- Two-sided rules (8) --------------------------------------------------
  # The severity ranges overlap, so an alert in the overlap matches the source
  # matchers AND the target matchers. These are the rules that exercise the
  # excludeTwoSidedMatch branch of Mutes: a warning under the first rule is a
  # target, and is muted by an active critical, but the other warnings in the
  # source cache are skipped so the two cannot inhibit each other.
  - source_matchers: ['severity =~ "critical|warning"']
    target_matchers: ['severity =~ "warning|info"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity =~ "warning|info"']
    target_matchers: ['severity =~ "info|none"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity =~ "critical|warning"', 'namespace =~ "kube-.*"']
    target_matchers: ['severity =~ "warning|info"', 'namespace =~ "kube-.*"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['alertname =~ "Kube(Node|Pod)NotReady"', 'severity =~ "critical|warning"']
    target_matchers: ['alertname =~ "Kube(Node|Pod)NotReady"', 'severity =~ "warning|info"']
    equal: [cluster]
  - source_matchers: ['severity =~ "critical|warning"', 'priority =~ "p[01]"']
    target_matchers: ['severity =~ "warning|info"', 'priority =~ "p[01]"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  # DEAD, and deliberately so: source and target matchers are identical, so
  # every cached source also matches the target and excludeTwoSidedMatch skips
  # all of them. It mutes nothing while walking the whole source cache on every
  # matching alert, which is the worst case for the two-sided check.
  - source_matchers: ['alertname =~ "Kube.*"', 'severity =~ "warning|info"']
    target_matchers: ['alertname =~ "Kube.*"', 'severity =~ "warning|info"']
    equal: [alertname, namespace, cluster]

  # A two-sided alert acting as a source. "info" is the only severity matching
  # both sides, so every mute this rule produces is a two-sided alert muting a
  # pure target. An info alert is never muted here: it satisfies the source
  # matchers, so excludeTwoSidedMatch skips the other infos in the cache.
  - source_matchers: ['severity = "info"']
    target_matchers: ['severity =~ "info|none"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]

  # The mirror image: the only target is "warning", which is itself two-sided,
  # and the only source that survives the exclusion is the pure-source
  # "critical". Every mute here is a source-only alert muting a two-sided one.
  - source_matchers: ['severity =~ "critical|warning"']
    target_matchers: ['severity = "warning"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]

  # --- Cluster x priority, critical -> info (13) ----------------------------
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-0"', 'priority = "p0"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-0"', 'priority = "p0"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-0"', 'priority = "p1"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-0"', 'priority = "p1"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-0"', 'priority = "p2"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-0"', 'priority = "p2"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-0"', 'priority = "p3"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-0"', 'priority = "p3"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-0"', 'priority = "p4"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-0"', 'priority = "p4"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-1"', 'priority = "p0"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-1"', 'priority = "p0"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-1"', 'priority = "p1"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-1"', 'priority = "p1"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-1"', 'priority = "p2"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-1"', 'priority = "p2"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-1"', 'priority = "p3"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-1"', 'priority = "p3"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-1"', 'priority = "p4"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-1"', 'priority = "p4"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-2"', 'priority = "p0"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-2"', 'priority = "p0"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-2"', 'priority = "p1"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-2"', 'priority = "p1"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]
  - source_matchers: ['severity = "critical"', 'cluster = "cluster-2"', 'priority = "p2"']
    target_matchers: ['severity = "info"', 'cluster = "cluster-2"', 'priority = "p2"', 'alertname != "Watchdog"']
    equal: [alertname, namespace]

  # --- Per-priority critical -> none, no equal (5) --------------------------
  - source_matchers: ['severity = "critical"', 'priority = "p0"']
    target_matchers: ['severity = "none"', 'priority = "p0"', 'alertname != "Watchdog"']
  - source_matchers: ['severity = "critical"', 'priority = "p1"']
    target_matchers: ['severity = "none"', 'priority = "p1"', 'alertname != "Watchdog"']
  - source_matchers: ['severity = "critical"', 'priority = "p2"']
    target_matchers: ['severity = "none"', 'priority = "p2"', 'alertname != "Watchdog"']
  - source_matchers: ['severity = "critical"', 'priority = "p3"']
    target_matchers: ['severity = "none"', 'priority = "p3"', 'alertname != "Watchdog"']
  - source_matchers: ['severity = "critical"', 'priority = "p4"']
    target_matchers: ['severity = "none"', 'priority = "p4"', 'alertname != "Watchdog"']

  # --- service regex (4) ----------------------------------------------------
  # service = idx%8, so a critical only ever carries servicePatterns[0] or [4].
  # Rules whose source regex misses both of those can never fire.
  - source_matchers: ['severity = "critical"', 'service =~ "prometheus-operator-.*"']
    target_matchers: ['severity = "warning"', 'service =~ "prometheus-operator-.*"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'service =~ "infrastructure-.*"']
    target_matchers: ['severity = "warning"', 'service =~ "infrastructure-.*"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  # DEAD: servicePatterns[3] lands on idx%4==3, which is always severity "none".
  - source_matchers: ['severity = "critical"', 'service =~ ".*-node-exporter"']
    target_matchers: ['severity = "warning"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  # DEAD: servicePatterns[6] lands on idx%4==2, which is always severity "info".
  - source_matchers: ['severity = "critical"', 'service = "data-pipeline-ingestion-worker"']
    target_matchers: ['severity =~ "warning|info"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]

  # --- job regex (3) --------------------------------------------------------
  - source_matchers: ['severity = "critical"', 'job = "kube-state-metrics"']
    target_matchers: ['severity = "warning"', 'job =~ ".*-exporter"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'job =~ "cert-manager|etcd"']
    target_matchers: ['severity = "warning"', 'job =~ "nginx-ingress|coredns"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  # DEAD: job = idx%8, so a critical is only ever jobs[0] or jobs[4], and
  # neither ends in "-exporter".
  - source_matchers: ['severity = "critical"', 'job =~ ".*-exporter"']
    target_matchers: ['severity = "warning"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]

  # --- env regex (3) --------------------------------------------------------
  - source_matchers: ['severity = "critical"', 'env =~ "prod.*"']
    target_matchers: ['severity =~ "warning|info"', 'env =~ "prod.*"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'env =~ "prod.*"']
    target_matchers: ['severity = "warning"', 'env =~ "staging.*"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  # DEAD: a critical on "testing-us-east-1" sits at idx%20==8, so the warning
  # beside it in the quad is always "staging-eu-west-1", never a prod env.
  - source_matchers: ['severity = "critical"', 'env = "testing-us-east-1"']
    target_matchers: ['severity = "warning"', 'env =~ "prod.*"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]

  # --- kube-* namespaces (3) ------------------------------------------------
  - source_matchers: ['severity = "critical"', 'namespace =~ "kube-.*"']
    target_matchers: ['severity =~ "warning|info"', 'namespace =~ "kube-.*"', 'alertname != "Watchdog"']
    equal: [alertname, cluster]
  - source_matchers: ['alertname = "KubeNodeNotReady"', 'severity = "critical"', 'namespace = "kube-system"']
    target_matchers: ['severity =~ "warning|info|none"', 'namespace = "kube-system"', 'alertname != "Watchdog"']
    equal: [cluster]
  # No equal: a kube-* critical mutes low-priority business-namespace noise.
  - source_matchers: ['severity = "critical"', 'namespace =~ "kube-.*"']
    target_matchers: ['severity = "none"', 'namespace =~ "payments|checkout"', 'alertname != "Watchdog"']

  # --- Team-scoped (10) -----------------------------------------------------
  # ALL DEAD. team = idx%25, so holding team fixed forces the index delta to a
  # multiple of 25; holding cluster fixed on top of that forces a multiple of
  # 100, which fixes severity too. Source and target can never differ in
  # severity. Dropping cluster from equal does not save them either: namespace
  # would then need 5*(a-b) == 6 (mod 10), which has no solution. Kept as the
  # kind of stale per-team rule a real config accumulates.
  - source_matchers: ['severity = "critical"', 'team = "team-0"']
    target_matchers: ['severity = "warning"', 'team = "team-0"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'team = "team-1"']
    target_matchers: ['severity = "warning"', 'team = "team-1"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'team = "team-2"']
    target_matchers: ['severity = "warning"', 'team = "team-2"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'team = "team-3"']
    target_matchers: ['severity = "warning"', 'team = "team-3"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'team = "team-4"']
    target_matchers: ['severity = "warning"', 'team = "team-4"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'team = "team-5"']
    target_matchers: ['severity = "warning"', 'team = "team-5"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'team = "team-6"']
    target_matchers: ['severity = "warning"', 'team = "team-6"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]
  - source_matchers: ['severity = "critical"', 'team = "team-7"']
    target_matchers: ['severity = "warning"', 'team = "team-7"', 'alertname != "Watchdog"']
    equal: [alertname, namespace, cluster]

# ---------------------------------------------------------------------------
# Receivers
#
# One receiver per team+cluster+priority leaf = 500 receivers.
# In practice you would point these at real PagerDuty/Slack/webhook URLs.
# Here they all point to a local null endpoint so the config is valid.
#
# Naming convention matches the generator's label pools:
#   team-{0..24}-cluster-{0..3}-p{0..4}
# ---------------------------------------------------------------------------
receivers:
  - name: "default"
    webhook_configs:
      - url: "http://localhost:1/webhook"
        send_resolved: true

  - name: "null"
    # Explicitly silent receiver for Watchdog and InfoInhibitor.

  # --- Specialty receivers ---
  - name: "production-critical"
    webhook_configs:
      - url: "http://localhost:1/webhook/production-critical"
        send_resolved: true

  - name: "kube-system-receiver"
    webhook_configs:
      - url: "http://localhost:1/webhook/kube-system"
        send_resolved: true

  - name: "exporter-receiver"
    webhook_configs:
      - url: "http://localhost:1/webhook/exporters"
        send_resolved: true

  # --- Team receivers (team-0 .. team-24) ---
